spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_test?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Reserve Redis DB 1 for tests; development must use a different DB (standalone Redis required).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=1
spring.data.redis.password=${TEST_REDIS_PASSWORD}

# Bound Redis connection/read waits, including test cleanup when Redis is unavailable.
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Public test fixture only; never use this key in production.
jwt.secret=TEST-ONLY-jwt-signing-key-not-for-production-2026-0123456789abcdef
jwt.expiration-ms=3600000

app.upload-dir=target/test-uploads
logging.file.name=target/test-logs/employee-management.log

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
